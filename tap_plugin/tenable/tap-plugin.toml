manifest_version = "0"
plugin_version = "0.1.0" # x-release-please-version
requires_tap = ">=0.3.2"
slug = "tenable"
name = "TAP Tenable"
description = "Tenable Security Center's results, plugins, observed hosts and services, consoles, scanners, zones, repositories, scans, asset lists and risk rules, read from its REST API and held on the grid as Tenable returns them."

# Tier-1 load order (req-tap-plugin-arch-dependencies). The Tenable edges name computing_core's package,
# ip_address, port and network_interface and compliance_core's vulnerability: a vocabulary dependency
# (new-plugin Step 6, Tier 1b), declared here with a note. No module imports either plugin.
depends_on = [
  { slug = "computing_core", note = "FOUND_IN_PACKAGE__tenable targets computing_core__package; ABOUT_PORT, ABOUT_ADDRESS, OBSERVED_AT_ADDRESS, OBSERVED_ON_PORT and REPORTS_INTERFACE target its port, ip_address and network_interface; vocabulary dependency" },
  { slug = "compliance_core", note = "ABOUT_VULNERABILITY__tenable targets compliance_core__compliance_vulnerability, written only against an existing node with the exact id; the plugin writes no compliance_core node; vocabulary dependency" },
]

# The author's DECLARED crypto posture (req-tap-plugin-manifest-v0-fips; spec-fips.md declare-vs-decide).
# The client (pyTenable over `requests`) reaches TLS through Python's ssl module and the system OpenSSL;
# the `pkcs12` extra, which bundles its own, is not installed (req-tenable-fips). This is a declaration to be
# checked: validate_plugin's crypto-providers report is the arbiter, and pydantic's compiled core is unobserved.
[fips]
status = "compatible"

[models]
tenable__tenable_security_center = "tap_plugin.tenable.models.security_center.TenableSecurityCenter"
tenable__tenable_scan_run = "tap_plugin.tenable.models.scan_run.TenableScanRun"
tenable__tenable_scanner = "tap_plugin.tenable.models.scanner.TenableScanner"
