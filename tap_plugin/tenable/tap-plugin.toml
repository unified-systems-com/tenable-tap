tenable__tenable_observed_host = "tap_plugin.tenable.models.observed_host.TenableObservedHost"
tenable__tenable_observed_program = "tap_plugin.tenable.models.observed_program.TenableObservedProgram"
tenable__tenable_finding = "tap_plugin.tenable.models.finding.TenableFinding"
