# TAP Tenable plugin: package-mode distribution, standalone from the first commit.
#
# Identity chain (pre-boot conformance gate enforces agreement):
#   slug             = "tenable"
#   distribution     = "tenable-tap"                (the -tap convention)
#   import namespace = "tap_plugin.tenable"         (PEP 420: no tap_plugin/__init__.py)
#   entry-point key  = "tenable"                    (== slug)
#
# Spec: specs/spec-tenable-v0.md.
[project]
name = "tenable-tap"
description = "TAP Tenable plugin: Tenable Security Center vulnerability findings and per-plugin package observations, read from its REST API onto the grid."
requires-python = ">=3.14"
dynamic = ["version"]

# Tier-0 dependencies (req-tap-plugin-arch-dependencies-1). computing_core owns the package type and
# compliance_core the vulnerability type the Tenable nodes link to. pyTenable is the Security Center
# client (req-tenable-transport), pinned EXACTLY and with no extra: the `pkcs12` and `all` extras pull in
# `cryptography`, whose wheels bundle their own OpenSSL (req-tenable-fips). 26.10.1 is the version the
# spec's survey read; nothing has been run against it yet.
dependencies = [
    "computing-core-tap",
    "compliance-core-tap",
    "pytenable==26.10.1",
]

[project.entry-points."tap.plugins"]
tenable = "tap_plugin.tenable.apps:TenableConfig"

# Developer-mode deps: the plugin's OWN dev closure (req-tap-plugin-arch-dev-deps); PEP 735,
# never installed by boot, never in the wheel.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# VCS-derived PEP 440 version (req-tap-plugin-arch-versioning-1); no hand-maintained field.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

# PEP 420 namespace build: ship tap_plugin/tenable/* with no tap_plugin/__init__.py.
[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/tenable"]
